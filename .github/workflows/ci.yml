# 持续集成。
#
# 这个仓库有一套三级验证策略（见 docs/工程约束.md 第 5 节），但在这份工作流出现
# 之前，**三级全靠人记得手动跑**。
#
#   第 1 级  tsc + lint + 格式 + 单测   → job: check（ubuntu，快）
#   第 2 级  真 Electron 端到端        → job: e2e（macOS，慢）
#   第 3 级  真实窗口冒烟 smoke.js     → **不进 CI，且永远不要进**
#
# 两个 job 都在 push 与 PR 上跑。本仓库是 public，而**标准** GitHub-hosted runner
# 在公开仓库上的用量免费且不限分钟（官方原文："Use of the standard GitHub-hosted
# runners is free and unlimited on public repositories."），所以不必再为额度做取舍。
# ⚠️ 这条免费只覆盖标准 runner：一旦把 runs-on 换成 `*-larger`，**即使公开仓库也
# 照价计费**（"Larger runners are always charged for, even when used by public
# repositories"）。本文件用的是 macos-latest，属标准 runner。
#
# 公开后真正的约束不是钱，而是**并发**：Free 计划总并发 20、其中 macOS 最多 5。
# macOS 那 5 个槽才是稀缺资源 —— 下面 `needs` 与 `timeout-minutes` 的理由都在这里。
#
# 第 3 级为什么排除在外：smoke.js 连的是**用户正在运行的那个实例**，还要从
# 用户已有的供应商里抄 baseUrl 与 apiKey 去建一次性供应商。CI 里既没有「用户
# 正在运行的应用」，也没有真实凭证。它的定位就是开发者本机的交互式检查。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时，取消上一次还没跑完的运行 —— 排队等一个已经过时的提交没有意义。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 静态检查与单元测试
    runs-on: ubuntu-latest
    # 兜底，不是预期耗时（正常 1~2 分钟）。job 的默认超时是 360 分钟，
    # 一旦某步挂住（网络、npm registry 无响应）就会一直占着并发槽 ——
    # Free 计划总并发只有 20，一个挂死的 run 能把后面排队的全堵住。
    timeout-minutes: 15
    # 备注：这里原本想用 ELECTRON_SKIP_BINARY_DOWNLOAD=1 跳过 Electron 二进制下载
    # （这个 job 并不启动 Electron），但 electron@44 的 install.js **不识别这个变量** ——
    # 实测 `grep -r ELECTRON_SKIP_BINARY_DOWNLOAD node_modules/electron` 无任何引用，
    # 而且该包的 `scripts` 是空对象（二进制是本仓库自己的 postinstall 下载的）。
    # 写上去只省不到时间，却会让人以为优化过了。宁可不优化，也不留一条说谎的注释。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 以下四步与 docs/工程约束.md 第 5 节的「第 1 级」一一对应，顺序也一致。
      # 本地一键跑完前三条：npm run verify
      - name: 类型检查（渲染进程 + 主进程）
        run: npm run typecheck

      - name: 代码规范
        run: npm run lint

      - name: 格式检查
        # lint 管语义，format:check 管排版，两者不重叠 ——
        # ESLint 不会因为一行写到 120 字符而报错，Prettier 会。
        # 本仓曾经「有 .prettierrc 但没人跑过」，接上这条就不会再漂移。
        run: npm run format:check

      - name: 单元测试
        run: npm test

      - name: 构建渲染进程
        # 单独跑一次 build：`npm ci` 不产出 dist/，而它是 npm start 与 e2e 的前提。
        # 构建失败必须在这里就暴露，而不是等打包时才发现。
        run: npm run build

  e2e:
    name: 真 Electron 端到端（接管 → 退出 → 还原）
    # 必须是 macOS：这一级验的是 `before-quit` 在真实退出路径上会不会触发、
    # `app.exit(0)` 会不会形成退出死循环 —— 那是 Electron 在 macOS 上的退出语义。
    #
    # 公开仓库的标准 runner 免费不限分钟，所以这里没有「只在 PR 上跑」的限制 ——
    # push 与 PR 都跑。稀缺的是并发：Free 计划的 macOS 上限只有 5 个。
    #
    # ⚠️ 来自 fork 的 PR：GitHub 默认要求有 write 权限的人**手动批准**才跑 workflow
    # （针对从未在本仓库合过 commit / PR 的贡献者）。第一个外部 PR 会停在
    # "Awaiting approval"，那不是 CI 坏了 —— 去 PR 页点 "Approve workflows to run"。
    #
    # needs：先跑完第 1 级再起 macOS。反过来的话，check 挂了 e2e 仍会跑到底 ——
    # 虽然不花钱，但会白占一个 macOS 并发槽，把真正需要它的 run 挤到队尾。
    needs: check
    runs-on: macos-latest
    # 兜底。job 默认超时 360 分钟，撞上就是一个槽被占满（单 job 上限 6 小时），
    # 后面所有 e2e 都排不上队。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建渲染进程
        # e2e 启动的是生产入口（scripts/e2e/app/main.js → src/main/index.js），
        # 没有 VITE_DEV_SERVER_URL，因此它加载的是 dist/renderer/index.html。
        # 少了这一步，验证会在「界面白屏」上失败。
        run: npm run build

      - name: 端到端检查
        # 全程跑在 mkdtemp 造出的隔离 HOME 上，不接触任何真实用户配置。
        run: npm run e2e
