<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      CSP：限制页面只能加载自身资源。
      渲染进程会展示来自上游 API 的内容，收紧资源加载面能显著降低
      万一有内容被当作代码执行时的破坏范围。

      开发期（npm run dev）会由 vite.config.ts 的 devCsp 插件放宽 script-src/connect-src，
      以放行 Vite 的 HMR；生产构建保持下面这份严格策略。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none';"
    />
    <title>cc-nbproject</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
